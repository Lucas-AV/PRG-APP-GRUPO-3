<!doctype html>

<html class="light" lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              outline: "#757c7d",
              "tertiary-container": "#e1d8fa",
              "secondary-dim": "#535356",
              "inverse-surface": "#0c0f0f",
              "surface-dim": "#d4dbdd",
              surface: "#f9f9f9",
              "surface-bright": "#f9f9f9",
              "surface-variant": "#dde4e5",
              "surface-container-low": "#f2f4f4",
              "surface-container": "#ebeeef",
              "on-surface-variant": "#5a6061",
              "secondary-fixed-dim": "#d5d4d8",
              "surface-container-high": "#e4e9ea",
              "on-background": "#2d3435",
              "on-error-container": "#752121",
              tertiary: "#615b77",
              secondary: "#5f5f62",
              "on-surface": "#2d3435",
              "outline-variant": "#adb3b4",
              "on-primary-fixed-variant": "#0052d0",
              "surface-container-highest": "#dde4e5",
              "primary-container": "#dae1ff",
              primary: "#0054d6",
              "on-error": "#fff7f6",
              "inverse-on-surface": "#9c9d9d",
              "on-tertiary-container": "#504b66",
              "primary-dim": "#004abd",
              "on-secondary-container": "#515155",
              "error-dim": "#4e0309",
              "error-container": "#fe8983",
              "surface-tint": "#0054d6",
              "surface-container-lowest": "#ffffff",
              "secondary-fixed": "#e4e2e6",
              "inverse-primary": "#5e8bff",
              "on-secondary-fixed": "#3f3f43",
              "on-secondary-fixed-variant": "#5b5b5f",
              "tertiary-fixed": "#e1d8fa",
              "primary-fixed": "#dae1ff",
              "on-primary-fixed": "#003894",
              "primary-fixed-dim": "#c7d3ff",
              "on-tertiary": "#fcf7ff",
              "on-primary": "#f8f7ff",
              "tertiary-fixed-dim": "#d3caeb",
              "on-secondary": "#faf8fc",
              error: "#9f403d",
              "secondary-container": "#e4e2e6",
              "on-primary-container": "#0049bb",
              "tertiary-dim": "#554f6b",
              "on-tertiary-fixed": "#3d3852",
              background: "#f9f9f9",
              "on-tertiary-fixed-variant": "#5a5470",
            },
            fontFamily: {
              headline: ["Manrope"],
              body: ["Inter"],
              label: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: "Manrope", sans-serif;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-surface text-on-surface min-h-screen pb-24">
    <!-- TopAppBar -->
    <header class="fixed top-0 w-full z-50 bg-[#f9f9f9] dark:bg-slate-950">
      <div
        class="flex items-center justify-between px-5 h-16 w-full max-w-screen-xl mx-auto"
      >
        <div class="flex items-center gap-4">
          <button
            class="text-[#0066FF] dark:text-blue-400 active:scale-95 duration-200 p-2 -ml-2 rounded-full hover:bg-[#ebeeef] dark:hover:bg-slate-800 transition-colors"
          >
            <span class="material-symbols-outlined">arrow_back</span>
          </button>
          <h1
            class="font-['Manrope'] text-lg font-bold tracking-tight text-on-surface"
          >
            Editar Perfil
          </h1>
        </div>
        <div class="w-10"></div>
        <!-- Spacer for symmetry -->
      </div>
      <div class="bg-[#f2f4f4] dark:bg-slate-900 h-[1px] w-full"></div>
    </header>
    <main class="pt-24 px-5 max-w-md mx-auto">
      <!-- Profile Picture Section -->
      <section class="flex flex-col items-center mb-10">
        <div class="relative group">
          <div
            class="w-32 h-32 rounded-full overflow-hidden ring-4 ring-surface-container-lowest shadow-sm"
          >
            <img
              alt="Avatar do usuário"
              class="w-full h-full object-cover"
              data-alt="professional headshot of a smiling man with short dark hair and a neat beard in soft natural daylight"
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHelpGAv0LkloDKBFlti-HaeTw98WF8wyaVKVOLVDxxaNW8CPDNiJKrCgq06Nprx9aO-edyssk4WioHENX3XhixMLRGdteHRkkVkZV_fXSQ17mb07JBZ47PaRRiTP7p663nV7mpN376rQ9rI29qMYypBcUwZ9VHP38pHAjtKKqGpAHD4d2pQztjmOA0BRl4qcLhOi3fz36kM0Te6Y91fsfC95rPcKxSlBmcFM5vneoRSFG6aHsN2OLFMVqhAX6fE6rf8XO-bvT3W4"
            />
          </div>
          <button
            class="absolute bottom-0 right-0 bg-primary text-on-primary p-2.5 rounded-full shadow-lg hover:brightness-110 active:scale-90 transition-all duration-200 flex items-center justify-center"
          >
            <span
              class="material-symbols-outlined !text-xl"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >photo_camera</span
            >
          </button>
        </div>
        <p class="mt-4 text-label-sm font-medium text-on-surface-variant">
          Toque para alterar a foto
        </p>
      </section>
      <!-- Form Fields -->
      <form class="space-y-6">
        <!-- Personal Info Group -->
        <div class="space-y-4">
          <div class="group">
            <label
              class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1"
              >Nome Completo</label
            >
            <div class="relative">
              <input
                class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3.5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all"
                placeholder="Ricardo Silveira"
                type="text"
              />
            </div>
          </div>
          <div class="group">
            <label
              class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1"
              >E-mail</label
            >
            <div class="relative">
              <input
                class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3.5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all"
                placeholder="ricardo.silveira@email.com"
                type="email"
              />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="group">
              <label
                class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1"
                >Telefone</label
              >
              <input
                class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3.5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all"
                placeholder="(11) 98765-4321"
                type="tel"
              />
            </div>
            <div class="group">
              <label
                class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1.5 ml-1"
                >Nascimento</label
              >
              <input
                class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3.5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all"
                placeholder="15/05/1990"
                type="text"
              />
            </div>
          </div>
        </div>
        <!-- Address Section (Editorial Style) -->
        <div class="pt-4">
          <label
            class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-3 ml-1"
            >Endereço Principal</label
          >
          <div
            class="bg-surface-container-lowest p-4 rounded-xl flex items-center justify-between group cursor-pointer hover:bg-surface-container transition-colors duration-200"
          >
            <div class="flex items-center gap-4">
              <div
                class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-primary"
              >
                <span class="material-symbols-outlined">home</span>
              </div>
              <div>
                <p class="text-sm font-semibold text-on-surface">
                  Rua das Flores, 123
                </p>
                <p class="text-xs text-on-surface-variant">
                  São Paulo, SP • 01234-567
                </p>
              </div>
            </div>
            <span
              class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors"
              >chevron_right</span
            >
          </div>
        </div>
      </form>
      <!-- Fixed Action Button Area -->
      <div class="mt-12">
        <button
          class="w-full bg-gradient-to-br from-[#0054d6] to-[#004abd] text-white font-bold py-4 rounded-xl shadow-[0_8px_24px_rgba(0,84,214,0.2)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2"
        >
          <span>Salvar Alterações</span>
        </button>
        <p class="text-center text-xs text-outline mt-6 px-8">
          Suas informações são tratadas de acordo com nossa Política de
          Privacidade.
        </p>
      </div>
    </main>
    <!-- BottomNavBar (Suppressed for transactional screen, but following structure if it were present) -->
    <!-- The "Shell Visibility & Relevance" rule: We suppress global nav on "focused" edit screens to prioritize task completion. -->
  </body>
</html>
