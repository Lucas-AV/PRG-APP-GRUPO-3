<!DOCTYPE html>

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f9f9f9;
        color: #2d3435;
      }
      h1, h2, h3 {
        font-family: 'Manrope', sans-serif;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-[#f9f9f9] dark:bg-slate-950 z-50">
<div class="flex items-center px-5 h-16 w-full max-w-7xl mx-auto">
<button class="text-[#0066FF] dark:text-blue-400 active:scale-95 duration-200 p-2 -ml-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Manrope'] text-lg font-bold tracking-tight text-on-background ml-2">Suporte e Ajuda</h1>
</div>
<div class="bg-[#f2f4f4] dark:bg-slate-900 h-[1px] w-full"></div>
</header>
<main class="max-w-7xl mx-auto px-5 pt-8 space-y-8">
<!-- Hero Status Card -->
<section>
<div class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/10 shadow-[0_8px_32px_rgba(45,52,53,0.04)]">
<div class="flex items-start justify-between">
<div class="space-y-1">
<div class="flex items-center gap-2">
<span class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
</span>
<span class="font-headline font-bold text-lg tracking-tight">Suporte Online</span>
</div>
<p class="text-on-surface-variant text-sm font-body">Estamos prontos para te ajudar agora.</p>
</div>
<div class="hidden sm:block">
<img alt="Support Avatar" class="w-16 h-16 rounded-full object-cover grayscale opacity-80" data-alt="friendly customer support representative portrait with a professional and welcoming expression in a bright studio" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBNOHcm8yQgGDfj04gqin2sKU4hh1YNwGmUaWUANqATrWiuDUFMIsrzZxOsOAN6kaYaLtUxxOv2L2j0PRKVEZVIji_RkFZkbQntBblZw7OPQ9juWDccSOjDTiuZR8aabVGmHord8_JYHq_Xu1GdjYJff3CrV_8eMa4B9IbgIBa16AbzTLez87hg8WjPAs8hlMlLIZWPIl1VB659ixdnEky7G-W279wSCx2qmWUQ0i7g8fh9fNVvX2MNWU7zV-RkIjlb0NBgajn-3WM"/>
</div>
</div>
<button class="mt-6 w-full bg-gradient-to-br from-primary to-primary-dim text-on-primary py-4 rounded-lg font-headline font-bold text-base shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all">
                    Iniciar Chat
                </button>
</div>
</section>
<!-- Contact Section -->
<section class="space-y-4">
<h2 class="font-headline font-extrabold text-xl tracking-tight px-1">Fale Conosco</h2>
<div class="grid grid-cols-3 gap-4">
<button class="flex flex-col items-center justify-center bg-surface-container-lowest aspect-square rounded-xl p-4 hover:bg-surface-container transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="chat">chat</span>
</div>
<span class="font-label text-[12px] font-semibold text-on-surface uppercase tracking-wide">WhatsApp</span>
</button>
<button class="flex flex-col items-center justify-center bg-surface-container-lowest aspect-square rounded-xl p-4 hover:bg-surface-container transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="mail">mail</span>
</div>
<span class="font-label text-[12px] font-semibold text-on-surface uppercase tracking-wide">E-mail</span>
</button>
<button class="flex flex-col items-center justify-center bg-surface-container-lowest aspect-square rounded-xl p-4 hover:bg-surface-container transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="call">call</span>
</div>
<span class="font-label text-[12px] font-semibold text-on-surface uppercase tracking-wide">Ligar</span>
</button>
</div>
</section>
<!-- FAQ Section -->
<section class="space-y-4 pb-12">
<div class="flex items-end justify-between px-1">
<h2 class="font-headline font-extrabold text-xl tracking-tight">Perguntas Frequentes</h2>
<span class="font-label text-xs font-bold text-primary uppercase tracking-widest mb-1">Ver Tudo</span>
</div>
<div class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-sm">
<!-- FAQ Item 1 -->
<button class="w-full flex items-center justify-between p-5 hover:bg-surface-container transition-colors text-left group">
<div class="flex items-center gap-4">
<div class="p-2 rounded-lg bg-surface-container">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="payments">payments</span>
</div>
<span class="font-body font-medium text-on-surface">Pagamentos e Reembolsos</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-[1px] mx-5 bg-surface-container"></div>
<!-- FAQ Item 2 -->
<button class="w-full flex items-center justify-between p-5 hover:bg-surface-container transition-colors text-left group">
<div class="flex items-center gap-4">
<div class="p-2 rounded-lg bg-surface-container">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="calendar_today">calendar_today</span>
</div>
<span class="font-body font-medium text-on-surface">Agendamentos e Cancelamentos</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-[1px] mx-5 bg-surface-container"></div>
<!-- FAQ Item 3 -->
<button class="w-full flex items-center justify-between p-5 hover:bg-surface-container transition-colors text-left group">
<div class="flex items-center gap-4">
<div class="p-2 rounded-lg bg-surface-container">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="verified_user">verified_user</span>
</div>
<span class="font-body font-medium text-on-surface">Segurança e Privacidade</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-[1px] mx-5 bg-surface-container"></div>
<!-- FAQ Item 4 -->
<button class="w-full flex items-center justify-between p-5 hover:bg-surface-container transition-colors text-left group">
<div class="flex items-center gap-4">
<div class="p-2 rounded-lg bg-surface-container">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="help_center">help_center</span>
</div>
<span class="font-body font-medium text-on-surface">Como usar o ConectaApp</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl shadow-[0_-8px_32px_rgba(45,52,53,0.04)] border-t border-[#adb3b4]/20">
<!-- Inicio -->
<div class="flex flex-col items-center justify-center text-[#5a6061] dark:text-slate-500 opacity-70 tap-highlight-transparent active:scale-90 transition-all hover:opacity-100">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-wider mt-1">Início</span>
</div>
<!-- Busca -->
<div class="flex flex-col items-center justify-center text-[#5a6061] dark:text-slate-500 opacity-70 tap-highlight-transparent active:scale-90 transition-all hover:opacity-100">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-wider mt-1">Busca</span>
</div>
<!-- Pedidos -->
<div class="flex flex-col items-center justify-center text-[#5a6061] dark:text-slate-500 opacity-70 tap-highlight-transparent active:scale-90 transition-all hover:opacity-100">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-['Inter'] text-[10px] font-medium uppercase tracking-wider mt-1">Pedidos</span>
</div>
<!-- Perfil (Active) -->
<div class="flex flex-col items-center justify-center text-[#0066FF] dark:text-blue-400 scale-110 transition-transform tap-highlight-transparent active:scale-90 hover:opacity-100">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-wider mt-1">Perfil</span>
</div>
</nav>
</body></html>
