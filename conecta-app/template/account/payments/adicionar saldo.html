<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-dim": "#554f6b",
                    "surface": "#f9f9f9",
                    "inverse-surface": "#0c0f0f",
                    "surface-container-low": "#f2f4f4",
                    "on-error-container": "#752121",
                    "on-error": "#fff7f6",
                    "surface-dim": "#d4dbdd",
                    "primary": "#0054d6",
                    "tertiary-fixed": "#e1d8fa",
                    "on-tertiary": "#fcf7ff",
                    "secondary-fixed-dim": "#d5d4d8",
                    "tertiary-fixed-dim": "#d3caeb",
                    "surface-container-high": "#e4e9ea",
                    "inverse-on-surface": "#9c9d9d",
                    "on-secondary-container": "#515155",
                    "on-primary": "#f8f7ff",
                    "surface-variant": "#dde4e5",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#2d3435",
                    "surface-tint": "#0054d6",
                    "surface-container-highest": "#dde4e5",
                    "error": "#9f403d",
                    "on-tertiary-container": "#504b66",
                    "on-secondary-fixed": "#3f3f43",
                    "on-primary-fixed-variant": "#0052d0",
                    "tertiary-container": "#e1d8fa",
                    "secondary-fixed": "#e4e2e6",
                    "secondary-container": "#e4e2e6",
                    "on-secondary": "#faf8fc",
                    "on-primary-container": "#0049bb",
                    "primary-container": "#dae1ff",
                    "on-surface-variant": "#5a6061",
                    "on-tertiary-fixed-variant": "#5a5470",
                    "primary-fixed-dim": "#c7d3ff",
                    "surface-container": "#ebeeef",
                    "on-tertiary-fixed": "#3d3852",
                    "secondary": "#5f5f62",
                    "primary-dim": "#004abd",
                    "inverse-primary": "#5e8bff",
                    "surface-bright": "#f9f9f9",
                    "outline": "#757c7d",
                    "background": "#f9f9f9",
                    "on-surface": "#2d3435",
                    "tertiary": "#615b77",
                    "primary-fixed": "#dae1ff",
                    "error-dim": "#4e0309",
                    "on-secondary-fixed-variant": "#5b5b5f",
                    "on-primary-fixed": "#003894",
                    "secondary-dim": "#535356",
                    "error-container": "#fe8983",
                    "outline-variant": "#adb3b4"
            },
            "borderRadius": {
                    "DEFAULT": "0.5rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "display": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-chip {
            background-color: #dae1ff;
            color: #0049bb;
            border: 1px solid #0054d6;
        }
        .glass-header {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-150 text-blue-600 dark:text-blue-400">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Manrope'] font-bold text-lg tracking-tight text-on-surface">Adicionar Saldo</h1>
</div>
<div>
<!-- Spacer for symmetry -->
<div class="w-6"></div>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-lg mx-auto">
<!-- Amount Input Section -->
<section class="mb-10 text-center">
<label class="block font-label text-sm font-semibold text-on-surface-variant mb-4 tracking-wide uppercase">Valor a depositar</label>
<div class="relative group">
<input class="w-full bg-transparent border-none text-center font-headline text-5xl font-extrabold text-primary focus:ring-0 placeholder-primary-dim/30" placeholder="R$ 0,00" type="text" value="R$ 0,00"/>
<div class="h-1 w-1/4 bg-primary/10 mx-auto mt-2 rounded-full group-focus-within:bg-primary transition-colors"></div>
</div>
</section>
<!-- Quick Select Chips -->
<section class="mb-12">
<div class="flex flex-wrap justify-center gap-3">
<button class="px-5 py-3 rounded-xl bg-surface-container-lowest font-label text-sm font-bold text-on-surface hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-95" onclick="updateValue('50')">R$ 50</button>
<button class="px-5 py-3 rounded-xl bg-surface-container-lowest font-label text-sm font-bold text-on-surface hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-95" onclick="updateValue('100')">R$ 100</button>
<button class="px-5 py-3 rounded-xl bg-surface-container-lowest font-label text-sm font-bold text-on-surface hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-95" onclick="updateValue('200')">R$ 200</button>
<button class="px-5 py-3 rounded-xl bg-surface-container-lowest font-label text-sm font-bold text-on-surface hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-95" onclick="updateValue('500')">R$ 500</button>
</div>
</section>
<!-- Payment Method Section -->
<section class="space-y-4">
<h2 class="font-headline text-xl font-bold text-on-surface px-1">Selecione a forma de pagamento</h2>
<div class="grid gap-3">
<!-- Pix Option -->
<label class="relative flex items-center p-5 rounded-2xl bg-surface-container-lowest cursor-pointer group transition-all hover:bg-surface-container-low">
<input checked="" class="sr-only peer" name="payment_method" type="radio"/>
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<div class="ml-4 flex-1">
<p class="font-headline font-bold text-on-surface">Pix</p>
<p class="text-xs font-label text-on-surface-variant">Aprovação imediata</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<div class="w-2 h-2 rounded-full bg-white opacity-0 peer-checked:opacity-100"></div>
</div>
</label>
<!-- Credit Card Option -->
<label class="relative flex items-center p-5 rounded-2xl bg-surface-container-lowest cursor-pointer group transition-all hover:bg-surface-container-low">
<input class="sr-only peer" name="payment_method" type="radio"/>
<div class="w-12 h-12 rounded-xl bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">credit_card</span>
</div>
<div class="ml-4 flex-1">
<p class="font-headline font-bold text-on-surface">Cartão de Crédito</p>
<p class="text-xs font-label text-on-surface-variant">Visa final 1234</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<div class="w-2 h-2 rounded-full bg-white opacity-0 peer-checked:opacity-100"></div>
</div>
</label>
<!-- Boleto Option -->
<label class="relative flex items-center p-5 rounded-2xl bg-surface-container-lowest cursor-pointer group transition-all hover:bg-surface-container-low">
<input class="sr-only peer" name="payment_method" type="radio"/>
<div class="w-12 h-12 rounded-xl bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">barcode_scanner</span>
</div>
<div class="ml-4 flex-1">
<p class="font-headline font-bold text-on-surface">Boleto</p>
<p class="text-xs font-label text-on-surface-variant">Aprovação em até 2 dias úteis</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<div class="w-2 h-2 rounded-full bg-white opacity-0 peer-checked:opacity-100"></div>
</div>
</label>
<!-- Add New Card Action -->
<button class="flex items-center justify-center gap-2 p-4 mt-2 rounded-2xl border-2 border-dashed border-outline-variant text-on-surface-variant font-label text-sm font-semibold hover:border-primary hover:text-primary transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-lg">add</span>
                    Usar novo cartão
                </button>
</div>
</section>
</main>
<!-- Confirm Button -->
<footer class="fixed bottom-0 w-full p-6 bg-gradient-to-t from-surface via-surface/90 to-transparent">
<div class="max-w-lg mx-auto">
<button class="w-full h-16 rounded-2xl bg-gradient-to-br from-primary to-primary-dim text-on-primary font-headline text-lg font-bold shadow-lg shadow-primary/20 active:scale-95 transition-transform duration-200">
                Confirmar Depósito
            </button>
</div>
</footer>
<script>
        function updateValue(value) {
            const input = document.querySelector('input[type="text"]');
            input.value = `R$ ${value},00`;
            
            // Interaction feedback
            const buttons = document.querySelectorAll('button[onclick]');
            buttons.forEach(btn => {
                btn.classList.remove('active-chip');
                if(btn.innerText.includes(value)) {
                    btn.classList.add('active-chip');
                }
            });
        }

        // Simple mask for the currency input
        const currencyInput = document.querySelector('input[type="text"]');
        currencyInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, "");
            value = (value / 100).toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
            e.target.value = value;
        });

        // Clear active chips when manual input happens
        currencyInput.addEventListener('focus', () => {
            const buttons = document.querySelectorAll('button[onclick]');
            buttons.forEach(btn => btn.classList.remove('active-chip'));
        });
    </script>
</body></html>
