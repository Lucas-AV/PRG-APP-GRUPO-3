<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Filtros - SevGen</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary": "#615b77",
                        "surface-container-high": "#e4e9ea",
                        "primary-fixed": "#dae1ff",
                        "on-tertiary-fixed-variant": "#5a5470",
                        "on-error": "#fff7f6",
                        "background": "#f9f9f9",
                        "secondary-fixed": "#e4e2e6",
                        "on-surface-variant": "#5a6061",
                        "tertiary-fixed-dim": "#d3caeb",
                        "tertiary-fixed": "#e1d8fa",
                        "on-secondary-fixed-variant": "#5b5b5f",
                        "on-error-container": "#752121",
                        "on-primary-fixed": "#003894",
                        "surface-container-highest": "#dde4e5",
                        "inverse-on-surface": "#9c9d9d",
                        "surface-tint": "#0054d6",
                        "on-secondary-container": "#515155",
                        "secondary-container": "#e4e2e6",
                        "surface-container": "#ebeeef",
                        "primary-container": "#dae1ff",
                        "surface": "#f9f9f9",
                        "on-secondary": "#faf8fc",
                        "on-secondary-fixed": "#3f3f43",
                        "inverse-primary": "#5e8bff",
                        "error-container": "#fe8983",
                        "primary": "#0054d6",
                        "secondary-dim": "#535356",
                        "outline": "#757c7d",
                        "on-primary-fixed-variant": "#0052d0",
                        "surface-variant": "#dde4e5",
                        "secondary-fixed-dim": "#d5d4d8",
                        "primary-fixed-dim": "#c7d3ff",
                        "surface-container-low": "#f2f4f4",
                        "on-tertiary-fixed": "#3d3852",
                        "surface-bright": "#f9f9f9",
                        "error-dim": "#4e0309",
                        "on-tertiary-container": "#504b66",
                        "on-tertiary": "#fcf7ff",
                        "outline-variant": "#adb3b4",
                        "surface-dim": "#d4dbdd",
                        "on-surface": "#2d3435",
                        "on-background": "#2d3435",
                        "tertiary-dim": "#554f6b",
                        "on-primary": "#f8f7ff",
                        "on-primary-container": "#0049bb",
                        "tertiary-container": "#e1d8fa",
                        "inverse-surface": "#0c0f0f",
                        "secondary": "#5f5f62",
                        "surface-container-lowest": "#ffffff",
                        "primary-dim": "#004abd",
                        "error": "#9f403d"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-surface text-on-surface font-body leading-relaxed">
    <!-- TopAppBar -->
    <header
        class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md fixed top-0 w-full z-50 flex items-center justify-between px-5 h-16 w-full">
        <div class="flex items-center gap-4">
            <button
                class="hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined text-on-surface" data-icon="close">close</span>
            </button>
            <h1 class="font-manrope font-bold text-lg tracking-tight text-on-surface">Filtros</h1>
        </div>
        <button
            class="text-blue-600 dark:text-blue-400 font-manrope font-bold text-lg tracking-tight hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors active:scale-95 duration-200 px-3 py-1 rounded-lg">
            Clear
        </button>
    </header>
    <!-- Main Content Canvas -->
    <main class="pt-20 pb-32 px-5 max-w-2xl mx-auto space-y-10">
        <!-- Section: Ordenar por -->
        <section>
            <div class="flex justify-between items-end mb-6">
                <h2 class="font-headline text-2xl font-extrabold tracking-tight text-on-surface">Ordenar por</h2>
                <span class="text-xs font-label uppercase tracking-widest text-on-surface-variant">Obrigatório</span>
            </div>
            <div class="space-y-3">
                <label
                    class="flex items-center justify-between p-4 rounded-xl bg-surface-container-lowest transition-all active:scale-[0.98] cursor-pointer group">
                    <span class="font-body font-medium text-on-surface">Relevância</span>
                    <div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
                        <div class="w-3 h-3 bg-primary rounded-full"></div>
                    </div>
                </label>
                <label
                    class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-all active:scale-[0.98] cursor-pointer group">
                    <span
                        class="font-body font-medium text-on-surface-variant group-hover:text-on-surface">Distância</span>
                    <div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
                </label>
                <label
                    class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-all active:scale-[0.98] cursor-pointer group">
                    <span
                        class="font-body font-medium text-on-surface-variant group-hover:text-on-surface">Avaliação</span>
                    <div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
                </label>
                <label
                    class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-all active:scale-[0.98] cursor-pointer group">
                    <span class="font-body font-medium text-on-surface-variant group-hover:text-on-surface">Preço</span>
                    <div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
                </label>
            </div>
        </section>
        <!-- Section: Distância -->
        <section>
            <h2 class="font-headline text-2xl font-extrabold tracking-tight text-on-surface mb-6">Distância</h2>
            <div class="bg-surface-container-low p-6 rounded-xl space-y-6">
                <input
                    class="w-full h-1.5 bg-surface-container-highest rounded-full appearance-none accent-primary cursor-pointer"
                    max="50" min="1" type="range" value="5" />
                <div class="flex justify-between text-sm font-label text-on-surface-variant font-medium">
                    <span>Até 1km</span>
                    <span class="text-primary font-bold">Até 5km</span>
                    <span>Até 10km</span>
                    <span>Qualquer</span>
                </div>
            </div>
        </section>
        <!-- Section: Avaliação -->
        <section>
            <h2 class="font-headline text-2xl font-extrabold tracking-tight text-on-surface mb-6">Avaliação</h2>
            <div class="flex gap-3">
                <button
                    class="flex-1 py-3 px-4 rounded-xl border border-outline-variant bg-surface-container-lowest flex items-center justify-center gap-2 hover:bg-primary-container hover:border-primary transition-all active:scale-95">
                    <span class="material-symbols-outlined text-sm text-amber-500" data-icon="star"
                        style="font-variation-settings: 'FILL' 1;">star</span>
                    <span class="font-label font-semibold text-on-surface">4.5+</span>
                </button>
                <button
                    class="flex-1 py-3 px-4 rounded-xl border border-primary bg-primary-container flex items-center justify-center gap-2 transition-all active:scale-95">
                    <span class="material-symbols-outlined text-sm text-amber-500" data-icon="star"
                        style="font-variation-settings: 'FILL' 1;">star</span>
                    <span class="font-label font-semibold text-on-primary-container">4.0+</span>
                </button>
                <button
                    class="flex-1 py-3 px-4 rounded-xl border border-outline-variant bg-surface-container-lowest flex items-center justify-center gap-2 hover:bg-primary-container hover:border-primary transition-all active:scale-95">
                    <span class="font-label font-semibold text-on-surface">Qualquer</span>
                </button>
            </div>
        </section>
        <!-- Section: Faixa de Preço -->
        <section>
            <h2 class="font-headline text-2xl font-extrabold tracking-tight text-on-surface mb-6">Faixa de Preço</h2>
            <div class="grid grid-cols-4 gap-3">
                <button
                    class="py-4 rounded-xl bg-surface-container-low text-on-surface-variant font-bold text-lg hover:bg-surface-container active:scale-95 transition-all">R$</button>
                <button
                    class="py-4 rounded-xl bg-primary text-on-primary font-bold text-lg shadow-lg shadow-primary/20 active:scale-95 transition-all">R$$</button>
                <button
                    class="py-4 rounded-xl bg-surface-container-low text-on-surface-variant font-bold text-lg hover:bg-surface-container active:scale-95 transition-all">R$$$</button>
                <button
                    class="py-4 rounded-xl bg-surface-container-low text-on-surface-variant font-bold text-lg hover:bg-surface-container active:scale-95 transition-all">R$$$$</button>
            </div>
        </section>
        <!-- Section: Categorias -->
        <section>
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-headline text-2xl font-extrabold tracking-tight text-on-surface">Categorias</h2>
                <button class="text-sm font-label text-primary font-semibold">Ver todas</button>
            </div>
            <div class="flex flex-wrap gap-2">
                <button
                    class="px-5 py-2.5 rounded-full bg-surface-container-highest text-on-surface font-medium text-sm flex items-center gap-2 active:scale-95 transition-all">
                    <span class="material-symbols-outlined text-lg"
                        data-icon="cleaning_services">cleaning_services</span>
                    Limpeza
                </button>
                <button
                    class="px-5 py-2.5 rounded-full bg-primary-container text-on-primary-container border border-primary/20 font-bold text-sm flex items-center gap-2 active:scale-95 transition-all">
                    <span class="material-symbols-outlined text-lg" data-icon="construction">construction</span>
                    Reformas
                </button>
                <button
                    class="px-5 py-2.5 rounded-full bg-surface-container-highest text-on-surface font-medium text-sm flex items-center gap-2 active:scale-95 transition-all">
                    <span class="material-symbols-outlined text-lg" data-icon="school">school</span>
                    Aulas
                </button>
                <button
                    class="px-5 py-2.5 rounded-full bg-surface-container-highest text-on-surface font-medium text-sm flex items-center gap-2 active:scale-95 transition-all">
                    <span class="material-symbols-outlined text-lg" data-icon="devices">devices</span>
                    Tecnologia
                </button>
            </div>
        </section>
        <!-- Contextual Visual Hint -->
        <div class="pt-4 pb-8">
            <div class="relative w-full h-40 rounded-xl overflow-hidden group">
                <img alt="Promo Banner"
                    class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                    data-alt="Modern professional office environment with soft natural light and people collaborating in a minimalist setting"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJseHimdm5vOxMt8Hgaj0p0G8VgXJr-Q54cueOgXehbfupO5j23wk_APJasUTXXWWWgC-Zi8L4BD9dz2ykUl7eo3aMqYhn-CfpKePcn_UhAVCrzH5nPvzzqFCVpjigSuhs53WoJxKwhzJfLhmV1-slbyRRNKyxpR2LNAAP2BRBbebkt3_XpQhn923wtU5wTMMYtgYpkHmAKtfMTkcTWT2ALkhKC3pqIXnLG7HHIceh4xDZfQUtxvJLoaY1c6pn5VR_7Lzc8XSo26E" />
                <div
                    class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex flex-col justify-end p-5">
                    <p class="text-white font-manrope font-bold text-lg">Encontre os melhores profissionais</p>
                    <p class="text-white/80 text-sm">Mais de 5.000 prestadores verificados na sua região.</p>
                </div>
            </div>
        </div>
    </main>
    <!-- BottomNavBar -->
    <footer
        class="fixed bottom-0 left-0 w-full z-50 bg-white dark:bg-zinc-900 pb-safe px-4 py-4 border-t border-zinc-100 dark:border-zinc-800 shadow-[0_-8px_32px_rgba(0,0,0,0.04)]">
        <button
            class="w-full bg-gradient-to-br from-blue-600 to-blue-700 dark:from-blue-500 dark:to-blue-600 text-white rounded-xl py-4 flex items-center justify-center gap-2 font-inter font-semibold text-sm uppercase tracking-wider hover:brightness-110 active:scale-[0.98] transition-all duration-150">
            <span class="material-symbols-outlined text-xl" data-icon="check_circle">check_circle</span>
            Show results
        </button>
    </footer>
</body>

</html>
