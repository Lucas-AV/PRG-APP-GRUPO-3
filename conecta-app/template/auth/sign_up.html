<!doctype html>

<html class="light" lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Conecta - Crie sua Conta</title>
    <!-- Google Fonts: Manrope & Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@700;800&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              tertiary: "#615b77",
              "on-tertiary-fixed": "#3d3852",
              "on-error-container": "#752121",
              "secondary-dim": "#535356",
              "on-primary": "#f8f7ff",
              "tertiary-dim": "#554f6b",
              surface: "#f9f9f9",
              "surface-container-highest": "#dde4e5",
              error: "#9f403d",
              "on-primary-fixed": "#003894",
              "on-secondary-fixed-variant": "#5b5b5f",
              "tertiary-container": "#e1d8fa",
              "on-tertiary": "#fcf7ff",
              "on-secondary": "#faf8fc",
              "surface-container-low": "#f2f4f4",
              "tertiary-fixed": "#e1d8fa",
              secondary: "#5f5f62",
              "on-secondary-fixed": "#3f3f43",
              "secondary-fixed": "#e4e2e6",
              "outline-variant": "#adb3b4",
              "inverse-on-surface": "#9c9d9d",
              "on-surface-variant": "#5a6061",
              "on-tertiary-container": "#504b66",
              "primary-fixed": "#dae1ff",
              "surface-bright": "#f9f9f9",
              "surface-dim": "#d4dbdd",
              outline: "#757c7d",
              background: "#f9f9f9",
              "inverse-surface": "#0c0f0f",
              primary: "#0054d6",
              "surface-container-lowest": "#ffffff",
              "primary-container": "#dae1ff",
              "on-surface": "#2d3435",
              "primary-dim": "#004abd",
              "surface-container-high": "#e4e9ea",
              "on-primary-fixed-variant": "#0052d0",
              "error-container": "#fe8983",
              "error-dim": "#4e0309",
              "tertiary-fixed-dim": "#d3caeb",
              "primary-fixed-dim": "#c7d3ff",
              "surface-variant": "#dde4e5",
              "on-tertiary-fixed-variant": "#5a5470",
              "secondary-container": "#e4e2e6",
              "secondary-fixed-dim": "#d5d4d8",
              "on-primary-container": "#0049bb",
              "surface-tint": "#0054d6",
              "inverse-primary": "#5e8bff",
              "on-secondary-container": "#515155",
              "on-error": "#fff7f6",
              "on-background": "#2d3435",
              "surface-container": "#ebeeef",
            },
            fontFamily: {
              headline: ["Manrope"],
              body: ["Inter"],
              label: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      .signature-gradient {
        background: linear-gradient(135deg, #0054d6 0%, #004abd 100%);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-surface font-body text-on-surface antialiased">
    <!-- TopAppBar -->
    <header
      class="fixed top-0 w-full z-50 bg-slate-50/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 w-full"
    >
      <div class="flex items-center gap-4">
        <button
          class="text-blue-600 hover:opacity-80 transition-opacity active:scale-95 duration-200"
        >
          <span class="material-symbols-outlined" data-icon="arrow_back"
            >arrow_back</span
          >
        </button>
        <h1 class="font-manrope font-bold text-xl tracking-tight text-blue-600">
          Crie sua Conta
        </h1>
      </div>
      <div class="w-10"></div>
      <!-- Spacer for center-alignment illusion -->
    </header>
    <main class="pt-24 pb-12 px-6 max-w-lg mx-auto min-h-screen flex flex-col">
      <!-- Editorial Header Section -->
      <section class="mb-10">
        <h2
          class="font-headline font-extrabold text-4xl text-on-surface tracking-tight mb-2"
        >
          Comece agora
        </h2>
        <p class="font-body text-on-surface-variant text-lg">
          Encontre os melhores profissionais perto de você.
        </p>
      </section>
      <!-- Registration Form -->
      <form class="space-y-6 flex-grow">
        <!-- Full Name -->
        <div class="space-y-2">
          <label
            class="font-label text-sm font-semibold text-on-surface-variant ml-1"
            for="name"
            >Nome Completo</label
          >
          <div class="relative">
            <input
              class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline"
              id="name"
              placeholder="Como quer ser chamado?"
              type="text"
            />
          </div>
        </div>
        <!-- Email -->
        <div class="space-y-2">
          <label
            class="font-label text-sm font-semibold text-on-surface-variant ml-1"
            for="email"
            >E-mail</label
          >
          <div class="relative">
            <input
              class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline"
              id="email"
              placeholder="seu@email.com"
              type="email"
            />
          </div>
        </div>
        <!-- Phone -->
        <div class="space-y-2">
          <label
            class="font-label text-sm font-semibold text-on-surface-variant ml-1"
            for="phone"
            >Celular</label
          >
          <div class="relative">
            <input
              class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline"
              id="phone"
              placeholder="(00) 00000-0000"
              type="tel"
            />
          </div>
        </div>
        <!-- Password Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label
              class="font-label text-sm font-semibold text-on-surface-variant ml-1"
              for="password"
              >Senha</label
            >
            <div class="relative">
              <input
                class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline"
                id="password"
                placeholder="••••••••"
                type="password"
              />
              <button
                class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors"
                type="button"
              >
                <span
                  class="material-symbols-outlined text-[20px]"
                  data-icon="visibility"
                  >visibility</span
                >
              </button>
            </div>
          </div>
          <div class="space-y-2">
            <label
              class="font-label text-sm font-semibold text-on-surface-variant ml-1"
              for="confirm-password"
              >Confirmar Senha</label
            >
            <div class="relative">
              <input
                class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline"
                id="confirm-password"
                placeholder="••••••••"
                type="password"
              />
            </div>
          </div>
        </div>
        <!-- Terms Checkbox -->
        <div class="flex items-start gap-3 py-2">
          <div class="flex items-center h-5">
            <input
              class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest"
              id="terms"
              type="checkbox"
            />
          </div>
          <label
            class="text-sm text-on-surface-variant leading-relaxed"
            for="terms"
          >
            Aceito os
            <a class="text-primary font-semibold hover:underline" href="#"
              >Termos de Uso</a
            >
            e
            <a class="text-primary font-semibold hover:underline" href="#"
              >Política de Privacidade</a
            >
          </label>
        </div>
        <!-- Primary Action -->
        <button
          class="w-full signature-gradient text-on-primary font-headline font-bold py-4 rounded-xl shadow-lg shadow-primary/10 active:scale-[0.98] transition-all hover:opacity-90"
          type="submit"
        >
          Criar Conta
        </button>
      </form>
      <!-- Footer -->
      <footer class="mt-12 text-center pb-8">
        <p class="text-on-surface-variant font-medium">
          Já tem uma conta?
          <a
            class="text-primary font-bold ml-1 hover:underline active:opacity-70 transition-all"
            href="#"
            >Entrar</a
          >
        </p>
      </footer>
    </main>
    <!-- Decorative Element (Ghost Layer) -->
    <div
      class="fixed top-0 right-0 -z-10 w-1/3 h-1/2 opacity-20 pointer-events-none overflow-hidden"
    >
      <div
        class="w-full h-full bg-gradient-to-bl from-primary/20 to-transparent blur-3xl rounded-full translate-x-1/2 -translate-y-1/2"
      ></div>
    </div>
  </body>
</html>
