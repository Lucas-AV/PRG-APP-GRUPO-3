<!doctype html>

<html class="light" lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              tertiary: "#615b77",
              "on-tertiary-fixed": "#3d3852",
              "on-error-container": "#752121",
              "secondary-dim": "#535356",
              "on-primary": "#f8f7ff",
              "tertiary-dim": "#554f6b",
              surface: "#f9f9f9",
              "surface-container-highest": "#dde4e5",
              error: "#9f403d",
              "on-primary-fixed": "#003894",
              "on-secondary-fixed-variant": "#5b5b5f",
              "tertiary-container": "#e1d8fa",
              "on-tertiary": "#fcf7ff",
              "on-secondary": "#faf8fc",
              "surface-container-low": "#f2f4f4",
              "tertiary-fixed": "#e1d8fa",
              secondary: "#5f5f62",
              "on-secondary-fixed": "#3f3f43",
              "secondary-fixed": "#e4e2e6",
              "outline-variant": "#adb3b4",
              "inverse-on-surface": "#9c9d9d",
              "on-surface-variant": "#5a6061",
              "on-tertiary-container": "#504b66",
              "primary-fixed": "#dae1ff",
              "surface-bright": "#f9f9f9",
              "surface-dim": "#d4dbdd",
              outline: "#757c7d",
              background: "#f9f9f9",
              "inverse-surface": "#0c0f0f",
              primary: "#0054d6",
              "surface-container-lowest": "#ffffff",
              "primary-container": "#dae1ff",
              "on-surface": "#2d3435",
              "primary-dim": "#004abd",
              "surface-container-high": "#e4e9ea",
              "on-primary-fixed-variant": "#0052d0",
              "error-container": "#fe8983",
              "error-dim": "#4e0309",
              "tertiary-fixed-dim": "#d3caeb",
              "primary-fixed-dim": "#c7d3ff",
              "surface-variant": "#dde4e5",
              "on-tertiary-fixed-variant": "#5a5470",
              "secondary-container": "#e4e2e6",
              "secondary-fixed-dim": "#d5d4d8",
              "on-primary-container": "#0049bb",
              "surface-tint": "#0054d6",
              "inverse-primary": "#5e8bff",
              "on-secondary-container": "#515155",
              "on-error": "#fff7f6",
              "on-background": "#2d3435",
              "surface-container": "#ebeeef",
            },
            fontFamily: {
              headline: ["Manrope"],
              body: ["Inter"],
              label: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      .signature-gradient {
        background: linear-gradient(135deg, #0054d6 0%, #004abd 100%);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container"
  >
    <main
      class="min-h-screen flex flex-col items-center justify-center px-6 py-12"
    >
      <div class="w-full max-w-md space-y-10">
        <header class="text-center space-y-6">
          <div class="inline-flex items-center justify-center">
            <span
              class="text-primary font-headline font-extrabold text-4xl tracking-tighter"
              >Conecta</span
            >
          </div>
          <div class="space-y-2">
            <h1
              class="font-headline font-extrabold text-3xl text-on-surface tracking-tight"
            >
              Bem-vindo de volta!
            </h1>
            <p
              class="text-on-surface-variant text-sm max-w-[280px] mx-auto leading-relaxed"
            >
              Entre para acessar seus serviços e agendamentos.
            </p>
          </div>
        </header>
        <section
          class="bg-surface-container-lowest p-8 rounded-lg shadow-[0_8px_32px_rgba(0,0,0,0.04)] space-y-6"
        >
          <form class="space-y-5">
            <div class="space-y-2">
              <label
                class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-wider"
                for="email"
                >E-mail</label
              >
              <div class="relative group">
                <div
                  class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors"
                >
                  <span class="material-symbols-outlined text-[20px]"
                    >mail</span
                  >
                </div>
                <input
                  class="block w-full pl-11 pr-4 py-3.5 bg-surface-container-highest border-none rounded-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all font-body text-sm"
                  id="email"
                  name="email"
                  placeholder="seu@email.com"
                  type="email"
                />
              </div>
            </div>
            <div class="space-y-2">
              <div class="flex justify-between items-center">
                <label
                  class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-wider"
                  for="password"
                  >Senha</label
                >
                <a
                  class="text-xs font-semibold text-primary hover:text-primary-dim transition-colors"
                  href="#"
                  >Esqueceu a senha?</a
                >
              </div>
              <div class="relative group">
                <div
                  class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors"
                >
                  <span class="material-symbols-outlined text-[20px]"
                    >lock</span
                  >
                </div>
                <input
                  class="block w-full pl-11 pr-12 py-3.5 bg-surface-container-highest border-none rounded-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all font-body text-sm"
                  id="password"
                  name="password"
                  placeholder="••••••••"
                  type="password"
                />
                <button
                  class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface-variant transition-colors"
                  type="button"
                >
                  <span class="material-symbols-outlined text-[20px]"
                    >visibility</span
                  >
                </button>
              </div>
            </div>
            <button
              class="w-full signature-gradient text-on-primary font-headline font-bold py-4 rounded-lg shadow-lg shadow-primary/20 active:scale-[0.98] transition-all duration-200 mt-2"
              type="submit"
            >
              Entrar
            </button>
          </form>
          <div class="relative flex items-center py-2">
            <div class="flex-grow border-t border-outline-variant/20"></div>
            <span
              class="flex-shrink mx-4 text-outline text-[11px] font-bold uppercase tracking-[0.2em]"
              >ou entre com</span
            >
            <div class="flex-grow border-t border-outline-variant/20"></div>
          </div>
          <button
            class="w-full flex items-center justify-center gap-3 py-3.5 bg-surface-container-low hover:bg-surface-container transition-all rounded-lg group border border-outline-variant/10"
          >
            <img
              alt="Google"
              class="w-5 h-5 group-hover:scale-110 transition-transform"
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyKfudmZjI29F1luDw4w6QNh2jAE8r9GkqCARerTK0TpsTHk3Z9eY9IZX4lVbLiwfWqE6yOuKS9UcNYNXoI4-3wfAVwvclNI3E6q6oej5V2QOiuq2zZpspVPxJuyQCj9otq3vPKXmC_M_rluaK2l9R4W50t8GWf1BweNv9oE6me4ZVsRJl33nXEMF0ajb83YumEErxxSPn3LBa2uRMpRsmUh1NyevLGArxQa5XFi490HK7-K4_QJRRu4shf1icVtZH3nYeP4ROMXI"
            />
            <span class="text-sm font-semibold text-on-surface"
              >Entrar com Google</span
            >
          </button>
        </section>
        <footer class="text-center">
          <p class="text-sm text-on-surface-variant">
            Ainda não tem uma conta?
            <a class="font-bold text-primary hover:underline ml-1" href="#"
              >Cadastre-se</a
            >
          </p>
        </footer>
      </div>
      <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div
          class="absolute -top-[10%] -right-[5%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"
        ></div>
        <div
          class="absolute -bottom-[10%] -left-[5%] w-[30%] h-[30%] bg-tertiary/5 blur-[100px] rounded-full"
        ></div>
      </div>
    </main>
  </body>
</html>
